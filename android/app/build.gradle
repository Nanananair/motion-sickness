plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.kinetosis.kinetosis_horizon"
    // Pinned rather than inherited: FOREGROUND_SERVICE_TYPE_SPECIAL_USE is an API 34 symbol.
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.kinetosis.kinetosis_horizon"
        // TYPE_APPLICATION_OVERLAY, the whole basis of the product, arrived in API 26.
        minSdk = 26
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // NotificationCompat / ActivityCompat, used by the overlay service and its permission flow.
    // Declared rather than inherited from the Flutter embedding so the version is ours to pin.
    implementation "androidx.core:core-ktx:1.12.0"
}
